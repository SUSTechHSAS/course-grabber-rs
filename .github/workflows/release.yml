name: Release

# 打 tag（v1.1.0）或手动触发，都会构建四个平台的"下载即用"包并挂到 Release 上。
# 识别库（另一个仓库）会在构建时 clone 下来一起编译 —— 它是 path 依赖，
# 编译期就并进这一个可执行文件里了。
#
# ⚠ 版本一致性：Release 的产物必须**恰好**是那个 tag 指向的提交构建出来的。
#   所以：
#     * tag 推送触发 → 签出该 tag 构建（天然一致）；
#     * 手动触发 → 必须给一个**新**版本号，工作流会在**本次构建的提交**上创建该 tag
#       （`gh release create --target $SHA`），并且拒绝覆盖已存在的 Release。
#   早期吃过亏：反复用同一个 tag 手动触发，产物被换成 master HEAD 构建的新二进制，
#   而 tag 还指着老提交 —— 别人 checkout 那个 tag 自己构建，得到的东西和发布的对不上。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "新版本号（例如 v1.1.0）。会在本次构建的提交上创建这个 tag 并发布。"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CAPTCHA_REPO: https://github.com/SUSTechHSAS/click-captcha-matcher-rs.git

jobs:
  build:
    name: 构建 ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x64
          - os: windows-latest
            asset: windows-x64
          - os: macos-15-intel  # Intel（macos-13 已被 GitHub 退役）
            asset: macos-x64
          - os: macos-14        # Apple Silicon
            asset: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - name: 取识别库（path 依赖，模型编在它里面）
        shell: bash
        run: git clone --depth 1 "$CAPTCHA_REPO" "${{ github.workspace }}/../click-captcha-matcher-rs"

      - uses: dtolnay/rust-toolchain@stable

      - name: 记录本次构建的提交
        shell: bash
        run: |
          echo "本次构建提交: $(git rev-parse HEAD)"
          echo "触发方式: ${{ github.event_name }}  ref: ${{ github.ref }}"

      - name: 编译
        run: cargo build --release --locked

      - name: 组装发布包（Linux / macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: ./packaging/build.sh

      # Windows 上不用 bash 脚本：tar/zip 直接用 PowerShell 的 Compress-Archive
      - name: 组装发布包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $Tag = "windows-x64"
          $Out = "dist/course-grabber-$Tag"
          Remove-Item -Recurse -Force $Out -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $Out | Out-Null
          Copy-Item target/release/course-grabber.exe "$Out/course-grabber.exe"
          Copy-Item config.example.json, README.md, LICENSE, packaging/run.bat $Out
          Compress-Archive -Path $Out -DestinationPath "dist/course-grabber-$Tag.zip" -Force
          Get-ChildItem dist

      - name: 产物自检（不需要网络、不需要账号）
        shell: bash
        run: |
          set -e
          cd dist/course-grabber-${{ matrix.asset }}
          if [ -f course-grabber.exe ]; then BIN=./course-grabber.exe; else BIN=./course-grabber; fi
          chmod +x "$BIN" || true
          "$BIN" --version
          cp config.example.json config.json
          out=$("$BIN" --offline)
          printf '%s\n' "$out" | tail -5
          printf '%s\n' "$out" | grep -q "operationType"
          size=$(stat -c %s "$BIN" 2>/dev/null || stat -f %z "$BIN")
          echo "可执行文件 $((size / 1024)) KB（含识别模型）"

      - uses: actions/upload-artifact@v4
        with:
          name: course-grabber-${{ matrix.asset }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: 发布
    needs: build
    # 某个平台构建失败时，其它平台照样发布（用 always 而不是依赖 build 全绿）
    if: always() && (startsWith(github.ref, 'refs/tags/') || inputs.version != '')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd artifacts
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: 建 Release 并上传（保证 tag == 构建提交 == 产物）
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          echo "版本 $VERSION  构建提交 $SHA"

          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "✗ Release $VERSION 已经存在。已发布的版本不允许被覆盖 ——"
            echo "  否则 tag 指向的提交和产物就对不上了。请换一个新版本号（如 v1.1.0）。"
            exit 1
          fi
          # tag 已存在是正常的（tag 推送触发时它当然存在）——只要它正好指向
          # 本次构建的那个提交就行；指向别的提交才是"tag 与产物对不上"。
          if existing=$(gh api "repos/$REPO/commits/$VERSION" --jq .sha 2>/dev/null); then
            if [ "$existing" != "$SHA" ]; then
              echo "✗ tag $VERSION 指向 $existing，而本次构建的是 $SHA —— 拒绝发布。"
              exit 1
            fi
            echo "tag 已存在且指向本次构建的提交，继续发布"
          else
            echo "tag 不存在，将由 gh release create --target 建在 $SHA 上"
          fi

          # --target 会把新 tag 建在**本次真正构建的那个提交**上
          gh release create "$VERSION" --repo "$REPO" --target "$SHA" \
            --title "$VERSION" --generate-notes
          gh release upload "$VERSION" --repo "$REPO" \
            artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS.txt

          tag_sha=$(gh api "repos/$REPO/commits/$VERSION" --jq .sha)
          echo "tag $VERSION → $tag_sha"
          if [ "$tag_sha" != "$SHA" ]; then
            echo "✗ tag 指向 $tag_sha，但产物是用 $SHA 构建的 —— 不一致！"
            exit 1
          fi
          echo "✅ 一致：tag、构建提交、产物三者对应同一个 commit"
          echo "https://github.com/$REPO/releases/tag/$VERSION"
